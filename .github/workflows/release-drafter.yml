name: Release Drafter

# Keeps a draft release proposing the next version, and labels pull requests by their branch's
# name. The draft is never published by hand: the Release workflow publishes it.
#
# The workflows and the tools are shared by every repository of the owner, from
# HairingX/workflows; this file is a copy of its template and is checked to stay so.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  drafter:
    name: Release Drafter
    permissions:
      contents: write
      pull-requests: write
    uses: HairingX/workflows/.github/workflows/release-drafter.yml@v2
