name: Tests

# The workflows and the tools are shared by every integration of the owner, from
# HairingX/ha_integration_workflows; this file is a copy of its template and is checked to stay so.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tests and type check
        uses: HairingX/ha_integration_workflows/actions/tests@v1
        with:
          branch: ${{ github.head_ref || github.ref_name }}
