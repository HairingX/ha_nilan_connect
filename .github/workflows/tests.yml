name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # The Release and Test build workflows run these on the exact commit they publish.
  workflow_call:
    inputs:
      ref:
        description: The commit to test.
        required: true
        type: string
      branch:
        description: The branch the commit is on, when it is not main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The Python the pinned Home Assistant release requires.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the test tools, Home Assistant and the libraries
        run: python -m pip install -r requirements-test.txt

      # A development branch is tested with the libraries' branch of the same name, where they
      # have one, as the three are developed together. main is tested with what the manifest pins.
      - name: Use the libraries' branch of the same name
        env:
          BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" == "main" ]]; then
            echo "main: the libraries the manifest pins"
            exit 0
          fi
          python .github/scripts/test_build.py libraries "$BRANCH" | while read -r requirement; do
            echo "Library: $requirement"
            python -m pip install "$requirement"
          done

      - name: Type check (pyright strict)
        run: |
          pyright
          pyright -p .github/scripts

      # Live tests need a real controller; they skip themselves without one, and are excluded here.
      # Every line of the integration is covered, and stays so.
      - name: Test
        run: >-
          python -m pytest -m "not live" -q -o log_cli=false
          --cov=custom_components.nilan_connect --cov-report=term-missing
          --cov-fail-under=100

      - name: Test the release scripts
        run: python -m pytest .github/scripts -q -o log_cli=false
