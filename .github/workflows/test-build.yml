name: Test build

# Run this from the Actions tab on a development branch, to try it on a real Home Assistant. It
# publishes the branch as a pre-release, which HACS offers only to those who switch beta versions
# on for this repository.
#
# The workflows and the tools are shared by every integration of the owner, from
# HairingX/ha_integration_workflows; this file is a copy of its template and is checked to stay so.
on:
  workflow_dispatch:

permissions: {}

# Not in the release group, as releases ignore test-build tags: GitHub keeps one waiting run per
# group, so a test build waiting there could cancel a waiting release.
concurrency:
  group: test-build
  cancel-in-progress: false

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  test-build:
    name: Test build
    permissions:
      contents: write
    uses: HairingX/ha_integration_workflows/.github/workflows/test-build.yml@v1
