name: Validate

# Home Assistant's own check of an integration (hassfest), and HACS's check of a repository it
# can install from. Both take their rules from their newest versions, so they also run daily: a
# new rule turns a build red before a user meets it.
#
# The workflows and the tools are shared by every integration of the owner, from
# HairingX/ha_integration_workflows; this file is a copy of its template and is checked to stay so.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        uses: hacs/action@main
        with:
          category: integration
