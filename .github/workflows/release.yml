name: Release

# Run this from the Actions tab. Never publish the draft release by hand: HACS installs the zip a
# release carries, which only this workflow builds.
#
# Everything runs in one direction, and nothing leaves the runner until it has been checked:
# resolve the version -> test and validate the exact commit -> build the zip with the manifest's
# version set, and check it -> tag that commit -> GitHub release with the zip. Nothing is pushed to
# main: the repository's manifest says 0.0.0, and the version lives in the tag and the zip.
on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          What to release. The version is worked out from the tags and the draft release: the
          next release candidate, or the final release that ends the series.
        required: true
        type: choice
        options:
          - release candidate
          - final release
        default: release candidate
      version:
        description: >-
          Override, only for a new major version, which is never worked out, or when the version
          worked out is wrong: canonical PEP 440 without a v, such as 2.0.0 or 2.0.0rc1, of the
          kind chosen above. It must still be higher than every version tagged.
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  MANIFEST: custom_components/nilan_connect/manifest.json

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are listed only to those who can push.
      contents: write
      # The pull requests merged since the previous release.
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Refuse to run from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          # The tests and this workflow are taken from the branch it runs from.
          echo "::error::Run the release from main, not $GITHUB_REF_NAME."
          exit 1

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.draft)] | sort_by(.created_at) | reverse | .[0].tag_name // empty')
          git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" \
            | cut -f2 | sed 's#^refs/tags/##' > "$RUNNER_TEMP/tags"
          python .github/scripts/release_version.py next "$RELEASE" "$draft" "$OVERRIDE" "$RUNNER_TEMP/tags" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Refuse a release without changes
        if: steps.version.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.version.outputs.previous_tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$SINCE...$(git rev-parse HEAD)" \
            --jq '.commits[].sha' > "$RUNNER_TEMP/commits"
          : > "$RUNNER_TEMP/merged"
          while read -r sha; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '.[] | select(.merged_at != null) | .number' >> "$RUNNER_TEMP/merged"
          done < "$RUNNER_TEMP/commits"
          python .github/scripts/release_version.py changes "$SINCE" "$RUNNER_TEMP/merged"

      - name: Record the commit to release
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  validate:
    name: Validate
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Tag and publish
    needs: [prepare, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Build the zip, with the manifest's version set
        run: |
          python .github/scripts/release_version.py write "$VERSION" "$MANIFEST"
          changed=$(git status --porcelain)
          if [[ "$changed" != " M $MANIFEST" ]]; then
            echo "::error::Setting the version changed something else, or nothing:"
            echo "$changed"
            exit 1
          fi
          zip=$(jq -r .filename hacs.json)
          python .github/scripts/release_zip.py "$(dirname "$MANIFEST")" "$RUNNER_TEMP/$zip" "$VERSION"
          echo "ZIP=$RUNNER_TEMP/$zip" >> "$GITHUB_ENV"

      - name: Tag the tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish the GitHub release with the zip
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases"             --jq '[.[] | select(.draft)] | sort_by(.created_at) | reverse | .[0] // empty')
          flags=()
          if [[ "$PRERELEASE" == "false" && -n "$draft" ]]; then
            # A final release carries the draft's notes, as edited before running this.
            jq -r '.body // ""' <<< "$draft" > notes.md
            flags+=(--notes-file notes.md)
          else
            # GitHub writes the notes from the pull requests since the previous release.
            flags+=(--generate-notes)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              flags+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag             --title "$TAG" "${flags[@]}"
          # The draft only proposed this release; Release Drafter drafts the next one.
          if [[ -n "$draft" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$(jq -r .id <<< "$draft")"
          fi
