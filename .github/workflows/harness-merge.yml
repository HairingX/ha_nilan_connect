name: Merge the test harness

# Dependabot proposes each release of the test harness, made for a newer Home Assistant. Where
# every check passes, the integration works on that Home Assistant as it is, and the update is
# merged; where one fails, the pull request stays open until the integration follows it.
#
# The workflows and the tools are shared by every integration of the owner, from
# HairingX/workflows; this file is a copy of its template and is checked to stay so.
on:
  pull_request:

permissions: {}

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  merge:
    name: Merge the test harness
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && startsWith(github.head_ref, 'dependabot/pip/pytest-homeassistant-custom-component-')
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: HairingX/workflows/.github/workflows/ha-harness-merge.yml@v2
