name: Test build cleanup

# Removes a branch's test builds, release and tag, once its pull request is closed or the branch
# is deleted.
#
# The workflows and the tools are shared by every integration of the owner, from
# HairingX/ha_integration_workflows; this file is a copy of its template and is checked to stay so.
on:
  pull_request:
    types: [closed]
  delete:

permissions: {}

# Not in the release group: GitHub keeps one waiting run per group, so a cleanup waiting there
# could cancel a waiting release.
concurrency:
  group: test-build-cleanup-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: false

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  cleanup:
    name: Test build cleanup
    permissions:
      contents: write
    uses: HairingX/ha_integration_workflows/.github/workflows/test-build-cleanup.yml@v1
