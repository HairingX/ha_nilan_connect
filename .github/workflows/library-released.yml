name: Library released

# A pull request's tests run with a library's branch of the same name, where it has one, and pass
# without a release. It is merged only with the libraries the manifest pins, which are released:
# this fails while a library is still taken from a branch.
#
# The workflows and the tools are shared by every integration of the owner, from
# HairingX/ha_integration_workflows; this file is a copy of its template and is checked to stay so.
on:
  pull_request:

permissions:
  contents: read

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  released:
    name: Libraries released and pinned
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: No library from a branch
        uses: HairingX/ha_integration_workflows/actions/libraries-released@v1
        with:
          branch: ${{ github.head_ref }}
