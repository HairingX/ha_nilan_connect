# How GitHub groups a release's notes: each pull request by its labels.
changelog:
  # The notes are for users: what is changed for them, not work on the repository itself.
  exclude:
    labels:
      - skip-changelog
      - chore
      - documentation
      - dependencies
  categories:
    - title: 🛠 Breaking Changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - feature request
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: Other Changes
      labels:
        - "*"
