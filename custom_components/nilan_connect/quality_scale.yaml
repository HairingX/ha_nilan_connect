rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: done
    comment: >-
      Each point is read at its own rate, and only what an enabled entity shows. Disabled polling
      stops reading on a schedule; homeassistant.update_entity reads an entity at once.
  brands:
    status: done
    comment: Shipped in brand/, which Home Assistant serves for custom integrations.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: >-
      By the gateway's id, where it is known; a unit set up by address whose gateway does not
      answer discovery is told apart by its name, which no two units may share.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The library logs once when the gateway stops answering and once when it answers again.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: todo
    comment: Follows discovery; a gateway picked again in the setup has its entry moved to its new address.
  discovery:
    status: todo
    comment: >-
      The setup looks for gateways on request. Discovery by Home Assistant itself needs something
      the gateway is known to announce, such as its DHCP host name, which is not verified yet.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: Not written yet.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: todo
    comment: Not written yet.
  dynamic-devices:
    status: exempt
    comment: An entry is one unit, which is one device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: A candidate is a gateway that refuses writes.
  stale-devices:
    status: exempt
    comment: An entry is one unit, which is one device; it goes with the entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The library speaks micro_nabto over UDP, not HTTP.
  strict-typing:
    status: done
    comment: pyright strict reports no errors; the libraries ship py.typed.
